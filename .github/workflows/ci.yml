name: Test music discovery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXTERNAL_APIS_ENABLED: "false"
      COOKIE_SECURE: "false"
      DATABASE_PATH: data/ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm ci && npm --prefix frontend ci
      - run: .venv/bin/ruff check backend recommendation scripts/backup.py --select E9,F63,F7,F82,F401
      - run: .venv/bin/ruff format --check backend recommendation scripts/backup.py
      - run: npm test
      - run: npm run typecheck && npm run build
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
